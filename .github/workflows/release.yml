name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'mymoney' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set or empty in GitHub Repository Secrets!"
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.keystore
          echo "Verifying keystore with keytool..."
          keytool -list -v -keystore keystore/release.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'mymoney' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Artifact
        id: prepare_artifact
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            RELEASE_TITLE="Release ${TAG_NAME}"
            APK_NAME="MyMoney-${TAG_NAME}.apk"
            IS_PRERELEASE="false"
          else
            VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
            if [ -z "$VERSION_NAME" ]; then
              VERSION_NAME="1.1.0"
            fi
            TAG_NAME="v${VERSION_NAME}"
            RELEASE_TITLE="Release v${VERSION_NAME}"
            APK_NAME="MyMoney-v${VERSION_NAME}.apk"
            IS_PRERELEASE="false"
          fi
          
          # Find the generated release APK
          ORIGINAL_APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          
          if [ -z "$ORIGINAL_APK" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          
          cp "$ORIGINAL_APK" "$APK_NAME"
          echo "apk_path=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_artifact.outputs.tag_name }}
          path: ${{ steps.prepare_artifact.outputs.apk_path }}
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prepare_artifact.outputs.apk_path }}
          tag_name: ${{ steps.prepare_artifact.outputs.tag_name }}
          name: ${{ steps.prepare_artifact.outputs.release_title }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.prepare_artifact.outputs.is_prerelease == 'true' }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
